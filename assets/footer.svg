<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 130" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0d1424" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footer-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Synapse Wave Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Dynamic Pulse Gradients -->
    <linearGradient id="pulse-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulse-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Orbs -->
    <radialGradient id="ambient-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-v" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="f-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Path for Travel Motion -->
    <path id="footer-motion-path" d="M 50,50 Q 250,15 450,50 T 850,50" />
    <path id="footer-motion-path-rev" d="M 850,50 Q 650,85 450,50 T 50,50" />
  </defs>

  <style>
    <![CDATA[
    @keyframes dash-stream-1 {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes dash-stream-2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }

    @keyframes pulse-beacon {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #00F5D4); }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #00F5D4); }
    }

    @keyframes radar-wave {
      0% { r: 3px; opacity: 0.9; }
      100% { r: 8px; opacity: 0; }
    }

    .pulse-line-1 {
      stroke-dasharray: 60 180;
      animation: dash-stream-1 3s linear infinite;
    }

    .pulse-line-2 {
      stroke-dasharray: 40 200;
      animation: dash-stream-2 3.8s linear infinite;
    }

    .status-dot {
      animation: pulse-beacon 2s ease-in-out infinite;
    }

    .radar-ring {
      animation: radar-wave 2s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
    }
    ]]>
  </style>

  <!-- Base Cyber Container -->
  <rect width="900" height="130" rx="14" fill="url(#footer-bg)" />
  <rect x="1" y="1" width="898" height="128" rx="13" fill="none" stroke="url(#footer-border)" stroke-width="1.2" />

  <!-- Ambient Light Wells -->
  <circle cx="200" cy="50" r="100" fill="url(#ambient-c)" />
  <circle cx="700" cy="50" r="100" fill="url(#ambient-v)" />

  <!-- Corner Brackets -->
  <g stroke="#00F5D4" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 888 24 L 888 12 L 876 12" />
    <path d="M 12 106 L 12 118 L 24 118" />
    <path d="M 888 106 L 888 118 L 876 118" />
  </g>

  <!-- ================= FLOATING CONTENT GROUP ================= -->
  <g id="floating-core">
    <!-- Smooth Native Floating Animation -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4s" repeatCount="indefinite" />

    <!-- Wave 1: Cyan High Synapse -->
    <path d="M 50,50 Q 250,15 450,50 T 850,50" fill="none" stroke="url(#wave-grad)" stroke-width="1.8" opacity="0.4" />
    <path d="M 50,50 Q 250,15 450,50 T 850,50" fill="none" stroke="url(#pulse-cyan)" stroke-width="2.6" class="pulse-line-1" filter="url(#f-glow)" />

    <!-- Wave 2: Violet Counter Synapse -->
    <path d="M 50,50 Q 250,85 450,50 T 850,50" fill="none" stroke="url(#wave-grad)" stroke-width="1.4" opacity="0.3" stroke-dasharray="3 3" />
    <path d="M 50,50 Q 250,85 450,50 T 850,50" fill="none" stroke="url(#pulse-violet)" stroke-width="2.2" class="pulse-line-2" filter="url(#f-glow)" />

    <!-- Traveling Agent Particle 1 (Cyan) -->
    <g>
      <circle r="4" fill="#00F5D4" filter="url(#f-glow)" />
      <circle r="7.5" fill="none" stroke="#00F5D4" stroke-width="1" opacity="0.6" />
      <animateMotion dur="4.2s" repeatCount="indefinite">
        <mpath href="#footer-motion-path" xlink:href="#footer-motion-path" />
      </animateMotion>
    </g>

    <!-- Traveling Agent Particle 2 (Violet) -->
    <g>
      <circle r="3.5" fill="#C084FC" filter="url(#f-glow)" />
      <circle r="6.5" fill="none" stroke="#A855F7" stroke-width="1" opacity="0.7" />
      <animateMotion dur="5.5s" repeatCount="indefinite" begin="-2s">
        <mpath href="#footer-motion-path-rev" xlink:href="#footer-motion-path-rev" />
      </animateMotion>
    </g>

    <!-- Synaptic Nodes on Wave -->
    <g fill="#00F5D4">
      <circle cx="50" cy="50" r="3.5" />
      <circle cx="250" cy="27" r="3" />
      <circle cx="450" cy="50" r="5" fill="#FFFFFF" filter="url(#f-glow)" />
      <circle cx="450" cy="50" r="9" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.8" />
      <circle cx="650" cy="73" r="3" fill="#A855F7" />
      <circle cx="850" cy="50" r="3.5" fill="#A855F7" />
    </g>

    <!-- Bottom Center Moniker Pill -->
    <g transform="translate(280, 84)">
      <rect x="0" y="0" width="340" height="26" rx="13" fill="#00F5D4" fill-opacity="0.06" stroke="#00F5D4" stroke-opacity="0.3" stroke-width="1" />
      <text x="170" y="17" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#00F5D4" letter-spacing="2">
        ✦ EXPLORING • BUILDING • EVOLVING ✦
      </text>
    </g>
  </g>

  <!-- Left Bottom Telemetry -->
  <g transform="translate(36, 102)" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#475569" letter-spacing="1">
    <text x="0" y="0">SYSTEM_ID: <tspan fill="#38BDF8">NK-21</tspan></text>
  </g>

  <!-- Right Bottom Live Radar Status -->
  <g transform="translate(760, 102)">
    <circle cx="0" cy="-3" r="3.5" fill="#00F5D4" class="status-dot" />
    <circle cx="0" cy="-3" r="3.5" fill="none" stroke="#00F5D4" stroke-width="1" class="radar-ring" />
    <text x="12" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#00F5D4" letter-spacing="1">
      STATUS: ACTIVE
    </text>
  </g>
</svg>
